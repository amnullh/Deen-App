name: deen_mobile
description: "Deen App: offline-first Azaan alerts and daily worship tools."
publish_to: none
resolution: workspace

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  android_intent_plus: ^6.1.0
  audio_session: ^0.2.4
  drift: ^2.35.2
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  just_audio: ^0.10.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.1
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  prayer_engine: ^0.1.0
  schedule_planner: ^0.1.0
  sqlite3: ^3.7.1
  timezone: ^0.11.2

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.4.0
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  pigeon: ^29.0.11
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
    - assets/cities/
    - assets/adhkar/
    - assets/oem_guides/

  # All fonts are SIL OFL 1.1, unmodified; see content/LICENSES.md section 5.
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Variable.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
