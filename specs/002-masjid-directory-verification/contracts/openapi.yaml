        A reviewer or super-admin who is not the requester, with a signed onboarding acknowledgement and step-up. `take` assigns the request to the caller. `approve` (a different decision from the requester, database CHECK `recovery_case_approver_not_initiator`) executes at once, with no delay in this variant: the old authenticator and recovery codes are deleted, all sessions are closed (`session_epoch` + 1) and a one-time 10-minute enrolment link is mailed. If the account recently changed email or password, ask for a call to an independent number first (runbook 14.2). `deny` needs a reason and mails the admin. The Operator never sees a secret or sets a credential. There is no `execute` route: it is a system event.

        Host: `console`. Roles: `reviewer`, `super_admin`. Scope: `global`. MFA: required. Step-up: 5min. Audit: `recovery.mfa_reset.taken`, `recovery.mfa_reset.approved`, `recovery.mfa_reset.denied`. State-machine events: `mfa_reset.take`, `mfa_reset.approve`, `mfa_reset.deny`. System events fired in the same transaction: `mfa_reset.execute`. An approve also writes `recovery.mfa_reset.executed`.
      parameters:
      - $ref: '#/components/parameters/RecoveryCaseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaResetDecisionRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCaseView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - cookieSession: []
        csrfToken: []
      x-host: console
      x-roles:
      - reviewer
      - super_admin
      x-scope: global
      x-mfa: required
      x-step-up: 5min
      x-audit-action:
      - recovery.mfa_reset.taken
      - recovery.mfa_reset.approved
      - recovery.mfa_reset.denied
      x-rate-limit: authenticated_api
      x-auth: session
      x-csrf: token
      x-events:
      - mfa_reset.take
      - mfa_reset.approve
      - mfa_reset.deny
      x-events-cascade:
      - mfa_reset.execute
