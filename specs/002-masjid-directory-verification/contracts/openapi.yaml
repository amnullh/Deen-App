x-rate-limit-tiers:
  login: 'Sign-in and token routes: 5 failures per 15 minutes per account and 20 per 15 minutes per address, doubling cool-off up to 24 hours; Operators lock after 10 until another super-admin unlocks them.'
  totp_code: 'TOTP and recovery code attempts: 5 per 5 minutes per session or flow and 10 per hour per account.'
  reset_email: 'Mails to an address (sign-up verification, reset, invitations, transfer offers, email change): 3 per hour per address and 10 per hour per source; identical response whether or not the address exists.'
  evidence_upload: 'Uploads: 10 MB per file, 8 files and 40 MB per claim, at most 20 uploads per day per account (also used for Masjid photos).'
  evidence_view: 'Evidence and committee-contact reads: 60 per minute per Operator; more than 25 distinct cases a day raises an insider alert.'
  public_write: 'Listener writes and the proof-of-work challenge: 5 per day per hashed-address bucket plus proof of work and a honeypot; bucket key is an HMAC of the address with a daily-rotating salt held in Valkey for at most 1 hour.'
  authenticated_api: 'Every other authenticated route: 120 requests per minute per session; a global circuit breaker at 600 per minute.'
  none: 'Health and readiness probes: not limited, not logged.'
x-hosts:
  console: Everything under /v1 except /v1/public/*; cookie auth; same origin as the console SPA.
  api: Only /v1/public/*; no cookies; the one host the phone app POSTs to.
