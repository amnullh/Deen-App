  /v1/claims/{claimId}/evidence:
    post:
      tags:
      - claims
      summary: Add evidence files to a claim
      operationId: uploadClaimEvidence
      description: |-
        Multipart: `kind`, `label` and up to 8 `files`. Limits 10 MB per file, 8 files and 40 MB per claim; at most 20 uploads per day per account. The type is decided by magic bytes (JPEG, PNG, WebP, PDF); everything else (archives, Office, SVG, HEIC, GIF) is rejected. Images are re-encoded to WebP (at most 3000 px, 40 megapixels in, metadata dropped); PDFs are rasterised (at most 10 pages, 150 dpi) in a sandbox. An unreadable or malicious file never reaches the claim machine: it is rejected with 422 `upload_rejected` per file and the claim stays Draft. Allowed while the claim is `draft` or `needs_info`.

        Host: `console`. Roles: `admin`. Scope: `self`. MFA: required. Step-up: none. Audit: `evidence.uploaded`.
