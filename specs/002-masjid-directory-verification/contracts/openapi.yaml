  /v1/public/pow-challenge:
    get:
      tags:
      - public
      summary: Fetch a proof-of-work challenge
      operationId: getPowChallenge
      description: |-
        Self-hosted, stateless (the challenge is HMAC-signed), Altcha format. The app solves it on the phone and sends the solution as `pow`. Served on `api.<domain>` only: no cookies, no CORS (the listener app is native), no address stored. Rate-limit buckets are an HMAC of the address with a daily-rotating salt, held in Valkey for at most one hour and never written to PostgreSQL, logs or backups (R-17).

        Host: `api`. Roles: `public`. Scope: `global`. MFA: not-required. Step-up: none. Audit: none.
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowChallenge'
              examples:
                default:
                  summary: Example
                  externalValue: examples/getPowChallenge.response.200.json
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      servers:
      - url: https://api.{domain}
        description: 'Listener write host: no cookies, public routes only.'
        variables:
          domain:
            default: deen.example
            description: Registrable domain of the deployment.
      x-host: api
      x-roles:
      - public
      x-scope: global
      x-mfa: not-required
      x-step-up: none
      x-audit-action: none
      x-rate-limit: public_write
      x-auth: none
      x-csrf: not-applicable
  /v1/health:
    get:
      tags:
      - ops
      summary: Liveness probe
      operationId: getHealth
      description: |-
        No authentication, no dependency check. Excluded from access logs and from the request metrics (research R-17, R-21).

        Host: `console`. Roles: `public`. Scope: `global`. MFA: not-required. Step-up: none. Audit: none.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                default:
                  summary: Example
                  externalValue: examples/getHealth.response.200.json
        4XX:
          description: Never returned by the handler. A reverse proxy in front may answer 4xx (for example 429 from the global circuit breaker); treat any answer other than 200 as not alive or not ready.
      security: []
      x-host: console
      x-roles:
      - public
      x-scope: global
      x-mfa: not-required
      x-step-up: none
      x-audit-action: none
      x-rate-limit: none
      x-auth: none
      x-csrf: not-applicable
      x-log-excluded: true
  /v1/ready:
    get:
      tags:
      - ops
      summary: Readiness probe
      operationId: getReady
      description: |-
        Checks PostgreSQL and Valkey. 200 when both answer, 503 otherwise. No authentication. Excluded from access logs.

        Host: `console`. Roles: `public`. Scope: `global`. MFA: not-required. Step-up: none. Audit: none.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
              examples:
                default:
                  summary: Example
                  externalValue: examples/getReady.response.200.json
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        4XX:
          description: Never returned by the handler. A reverse proxy in front may answer 4xx (for example 429 from the global circuit breaker); treat any answer other than 200 as not alive or not ready.
      security: []
      x-host: console
      x-roles:
      - public
      x-scope: global
      x-mfa: not-required
      x-step-up: none
      x-audit-action: none
      x-rate-limit: none
      x-auth: none
      x-csrf: not-applicable
      x-log-excluded: true
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: Opaque session id cookie (`Secure; HttpOnly; SameSite=Strict`, no Domain). Set by the sign-in routes; never readable by JavaScript. Console origin only.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchroniser token from `GET /v1/session`, bound to the session; required together with the cookie on every unsafe method.
    preAuthChallenge:
      type: apiKey
      in: cookie
      name: __Host-pa
      description: Five-minute single-purpose challenge cookie set after the password step or an opened reset link. It identifies a login, enrolment or reset flow and is never a session.
  parameters:
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 512
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Page size (1 to 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SessionHandlePath:
      name: sessionHandle
      in: path
      required: true
      description: Public handle of a session (never the session id).
      schema:
        $ref: '#/components/schemas/Uuid'
    RequestIdPath:
      name: requestId
      in: path
      required: true
      description: Privacy request id.
      schema:
        $ref: '#/components/schemas/Uuid'
    MasjidIdPath:
      name: masjidId
      in: path
      required: true
      description: Masjid id (`m` plus 7 base32 characters). Never derived from an OSM id.
      schema:
        $ref: '#/components/schemas/MasjidId'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `version_no` last read, as a strong ETag such as `"12"`. A stale value answers 412 `version_conflict`, a lost race inside the transaction 409 `version_conflict`, a missing header 428 `precondition_required`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
        example: '"12"'
    PhotoIdPath:
      name: photoId
      in: path
      required: true
      description: Photo id.
      schema:
        $ref: '#/components/schemas/Uuid'
    VersionNoPath:
      name: versionNo
      in: path
      required: true
      description: Version number (integer, at least 1).
      schema:
        type: integer
        minimum: 1
    InvitationIdPath:
      name: invitationId
      in: path
      required: true
      description: Invitation id.
      schema:
        $ref: '#/components/schemas/Uuid'
    MemberIdPath:
      name: memberId
      in: path
      required: true
      description: Membership handle (account id of the member).
      schema:
        $ref: '#/components/schemas/Uuid'
    TransferIdPath:
      name: transferId
      in: path
      required: true
      description: Ownership transfer id.
      schema:
        $ref: '#/components/schemas/Uuid'
    ClaimIdPath:
      name: claimId
      in: path
      required: true
      description: Claim id.
      schema:
        $ref: '#/components/schemas/Uuid'
    CaseIdPath:
      name: caseId
      in: path
      required: true
      description: Review case id (equals the claim id).
      schema:
        $ref: '#/components/schemas/Uuid'
    EvidenceIdPath:
      name: evidenceId
      in: path
      required: true
      description: Evidence file id (one sanitised page image).
      schema:
        $ref: '#/components/schemas/Uuid'
    AppealIdPath:
      name: appealId
      in: path
      required: true
      description: Appeal id.
      schema:
        $ref: '#/components/schemas/Uuid'
    ConflictIdPath:
      name: conflictId
      in: path
      required: true
      description: Claim conflict id.
      schema:
        $ref: '#/components/schemas/Uuid'
    AccountIdPath:
      name: accountId
      in: path
      required: true
      description: Account id.
      schema:
        $ref: '#/components/schemas/Uuid'
    TaskIdPath:
      name: taskId
      in: path
      required: true
      description: Operator task id.
      schema:
        $ref: '#/components/schemas/Uuid'
    ReportIdPath:
      name: reportId
      in: path
      required: true
      description: Abuse report id.
      schema:
        $ref: '#/components/schemas/Uuid'
    SuggestionIdPath:
      name: suggestionId
      in: path
      required: true
      description: Suggestion id.
      schema:
        $ref: '#/components/schemas/Uuid'
    CandidateIdPath:
      name: candidateId
      in: path
      required: true
      description: Duplicate candidate id.
      schema:
        $ref: '#/components/schemas/Uuid'
    BatchIdPath:
      name: batchId
      in: path
      required: true
      description: OSM import batch id.
      schema:
        $ref: '#/components/schemas/Uuid'
    RecoveryCaseIdPath:
      name: recoveryCaseId
      in: path
      required: true
      description: Recovery case id.
      schema:
        $ref: '#/components/schemas/Uuid'
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: A one-time token (email link, invitation, cancel link) is invalid, expired or already used (`token_invalid`), or the proof of work is missing or wrong (`pow_invalid`). Nothing is stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            token_invalid:
              summary: token invalid
              externalValue: examples/error.token_invalid.json
            pow_invalid:
              summary: pow invalid
              externalValue: examples/error.pow_invalid.json
    Unauthorized:
      description: 'No valid session, or the second factor is not verified yet. `unauthenticated`: no session, an expired session or a deleted or suspended account (all look the same). `mfa_required`: password only or enrolment pending; no data is returned. `invalid_credentials`: sign-in failed; identical for unknown and known accounts.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            mfa_required:
              summary: mfa required
              externalValue: examples/error.mfa_required.json
            invalid_credentials:
              summary: invalid credentials
              externalValue: examples/error.invalid_credentials.json
    Forbidden:
      description: 'Authenticated but not allowed: `forbidden` (role or ownership guard), `step_up_required` (needs a fresh step-up, see `required_step_up`), `csrf_failed` (missing or wrong `X-CSRF-Token`) or `origin_not_allowed` (unsafe request whose `Origin` is not the console origin).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            step_up_required:
              summary: step up required
              externalValue: examples/error.step_up_required.json
    NotFound:
      description: The resource does not exist OR the caller may not see it (another Masjid, another claimant's claim, a case not assigned to them). Both cases return the same status, code and body shape, so existence never leaks.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              summary: not found
              externalValue: examples/error.not_found.json
    Conflict:
      description: State conflict. `illegal_transition` carries `state` and `event` (a legal-looking call in the wrong state; nothing changed, no audit row). `guard_failed` carries `guard` (a business guard such as `call_ok` or `listing_not_suspended`). `version_conflict` is a lost optimistic-lock race. `duplicate_nearby` lists candidates. `delay_not_elapsed` refuses a break-glass before `not_before`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            illegal_transition:
              summary: illegal transition
              externalValue: examples/error.illegal_transition.json
            guard_failed:
              summary: guard failed
              externalValue: examples/error.guard_failed.json
            duplicate_nearby:
              summary: duplicate nearby
              externalValue: examples/error.duplicate_nearby.json
    PreconditionFailed:
      description: '`If-Match` does not equal the current `version_no` (`version_conflict`, with `current_version` for an editor). Nothing changed.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            version_conflict:
              summary: version conflict
              externalValue: examples/error.version_conflict.json
    PreconditionRequired:
      description: The `If-Match` header is required on this write (`precondition_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 'The body or a file exceeds the limit (`payload_too_large`): 10 MB per file, 8 files, 40 MB per claim.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Mutating routes accept `application/json` only (`multipart/form-data` on the two upload routes). `unsupported_media_type`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The request is well-formed but invalid (`validation_failed`), a schedule has error-severity issues (`schedule_invalid`) or an upload was refused (`upload_rejected`). `errors[]` lists the issues; nothing was stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation_failed:
              summary: validation failed
              externalValue: examples/error.validation_failed.json
            schedule_invalid:
              summary: schedule invalid
              externalValue: examples/error.schedule_invalid.json
            upload_rejected:
              summary: upload rejected
              externalValue: examples/error.upload_rejected.json
    RateLimited:
      description: Too many requests (`rate_limited`). Wait for `Retry-After` seconds; the limit tier of the route is in `x-rate-limit`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              summary: rate limited
              externalValue: examples/error.rate_limited.json
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    ServiceUnavailable:
      description: A dependency is down (`service_unavailable`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    MasjidId:
      type: string
      pattern: ^m[a-z2-7]{7}$
      description: 'Our own Masjid id: `m` plus 7 random base32 characters (data-model R-26). Never derived from an OSM id.'
      example: m4kx72ab
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: UTC instant, RFC 3339.
    DateOnly:
      type: string
      format: date
      description: Calendar date `YYYY-MM-DD`.
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: ISO 3166-1 alpha-2.
    Geohash5:
      type: string
      pattern: ^[0-9b-hjkmnp-z]{5}$
      description: '5 km cell id: geohash precision 5. Precision 6 or finer never exists anywhere in this API (FR-011, FR-033).'
    Email:
      type: string
      format: email
      maxLength: 254
    Locale:
      type: string
      pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
      maxLength: 35
      description: BCP 47 language tag.
    Password:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: Any Unicode, no composition rules, paste allowed. Minimum 12 characters (Operators 15), maximum 128; common and breached passwords are rejected from a local list and context words are refused (R-09). Verified exactly as received.
    TotpCode:
      type: string
      pattern: ^[0-9]{6}$
      writeOnly: true
      description: Six-digit TOTP (SHA-1, 30 s, window zero). A code can be used once per time step.
    RecoveryCode:
      type: string
      pattern: ^[0-9A-Za-z]{4}(-?[0-9A-Za-z]{4}){3}$
      description: Recovery code `XXXX-XXXX-XXXX-XXXX` (Crockford base32, 80 bits). The server strips hyphens and spaces and maps I, L to 1 and O to 0 before checking.
      example: 7K3M-9Q2D-XH4T-BN8P
    OneTimeToken:
      type: string
      minLength: 43
      maxLength: 64
      pattern: ^[A-Za-z0-9_-]+$
      writeOnly: true
      description: 256-bit single-use token from an email link, base64url. Only its SHA-256 is stored.
    TermsVersion:
      type: string
      minLength: 1
      maxLength: 40
      description: Version label of the terms document the person accepted, for example `2026-10-01`.
      example: '2026-10-01'
    ReasonText:
      type: string
      minLength: 3
      maxLength: 2000
      description: Plain sentence the admin will read. No names, phone numbers or evidence details (runbook 3.2).
    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      required:
      - lat
      - lon
      description: 'WGS 84 point. Authenticated routes only: listener-facing routes never carry coordinates.'
      additionalProperties: false
    Address:
      type: object
      properties:
        street:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 200
        region:
          type: string
          maxLength: 200
        postcode:
          type: string
          maxLength: 200
      description: Free-text address parts, each at most 200 characters.
      additionalProperties: false
    AccountKind:
      type: string
      enum:
      - admin
      - muazzin
      - operator
    OperatorRole:
      type: string
      enum:
      - reviewer
      - moderator
      - super_admin
    MembershipRole:
      type: string
      enum:
      - admin
      - muazzin
    AccountStatus:
      type: string
      enum:
      - pending_mfa
      - active
      - locked
      - disabled
      description: state-machines.md 4d.
    ListingStatus:
      type: string
      enum:
      - unclaimed
      - pending
      - verified
      - suspended
      - revoked
      description: Masjid listing machine (state-machines.md section 2).
    ClaimStatus:
      type: string
      enum:
      - draft
      - submitted
      - in_review
      - needs_info
      - verified
      - rejected
      - rejected_final
      - appealed
      - withdrawn
      - conflicted
      - superseded
      - expired
      - revoked
      - revoked_final
      description: Claim machine (state-machines.md section 1), stored snake_case (data-model section 5).
    ClaimKind:
      type: string
      enum:
      - claim
      - create
      - renewal
    ClaimEvent:
      type: string
      enum:
      - submit
      - assign
      - request_info
      - respond
      - verify
      - reject
      - appeal
      - appeal_reopen
      - appeal_dismiss
      - withdraw
      - arbitrate_resume
      - arbitrate_reject
      - request_early_deletion
      description: Events a caller may fire over HTTP. System events (timeout, expire, supersede, conflict_open, lapse_appeal_window, listing_revoked) have no route.
    ReasonCode:
      type: string
      enum:
      - VER-CONFIRMED
      - VER-RENEWED
      - NMI-DOCS-UNREADABLE
      - NMI-DOCS-INCOMPLETE
      - NMI-LETTER-MISSING
      - NMI-PHOTOS
      - NMI-CONTACTS-INVALID
      - NMI-DETAILS-MISMATCH
      - NMI-CALL-NOT-REACHED
      - REJ-NOT-AUTHORISED
      - REJ-EVIDENCE-INAUTHENTIC
      - REJ-CONTACT-DISOWNED
      - REJ-LOST-ARBITRATION
      - REJ-NO-RESPONSE
      - REJ-NOT-A-MASJID
      - REJ-IDENTICAL-EVIDENCE
      - SUS-ABUSE-REPORT
      - SUS-SECURITY
      - SUS-DISPUTE
      - SUS-WRONG-SCHEDULE
      - REV-FALSE-CLAIM
      - REV-IMPERSONATION
      - REV-COMMITTEE-WITHDREW
      - REV-FORGED-EVIDENCE
      - REV-TERMS-BREACH
      description: 'Decision reason codes (operator runbook 3.2). The prefix must match the decision: VER for verify, NMI for request_info, REJ for reject, SUS for suspend, REV for revoke.'
    CallOutcome:
      type: string
      enum:
      - C1
      - C2
      - C3
      - C4
      - C5
      - C6
      - C7
      description: 'Phone call outcome (runbook 5.5): C1 confirmed, C2 denied, C3 unsure, C4 no answer, C5 wrong number, C6 declined, C7 suspicious.'
    Prayer:
      type: string
      enum:
      - fajr
      - dhuhr
      - asr
      - maghrib
      - isha
    FieldIssue:
      type: object
      properties:
        path:
          type: string
          description: JSON pointer into the request body, or the schedule path such as `r[0].p.is.i`.
        code:
          type: string
          maxLength: 64
          description: Stable machine code, for example `primary_name_count` or `iqamah_before_azaan`.
        severity:
          type: string
          enum:
          - error
          - warning
          default: error
        message_key:
          type: string
          description: Localisation key; console text stays localizable (FR-007).
        args:
          type: object
          additionalProperties: true
      required:
      - path
      - code
      - message_key
    Error:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI, `https://<console-host>/problems/<code>`.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
          - unauthenticated
          - invalid_credentials
          - mfa_required
          - step_up_required
          - forbidden
          - csrf_failed
          - origin_not_allowed
          - not_found
          - version_conflict
          - precondition_required
          - illegal_transition
          - guard_failed
          - duplicate_nearby
          - delay_not_elapsed
          - validation_failed
          - schedule_invalid
          - upload_rejected
          - payload_too_large
          - unsupported_media_type
          - rate_limited
          - token_invalid
          - pow_invalid
          - service_unavailable
          description: Stable machine code. `mfa_required` and `step_up_required` tell a client which sign-in step to show; `illegal_transition` carries `state` and `event`; `guard_failed` carries `guard`.
        detail:
          type: string
          description: Human-readable, never contains ids of resources the caller may not see.
        request_id:
          $ref: '#/components/schemas/Uuid'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
          description: Field-level problems for `validation_failed`, `schedule_invalid`, `upload_rejected`.
        state:
          type: string
          description: Current state, for `illegal_transition`.
        event:
          type: string
          description: Attempted event, for `illegal_transition`.
        guard:
          type: string
          description: Failed guard name from state-machines.md section 0, for `guard_failed`.
        retry_after_seconds:
          type: integer
          minimum: 1
          description: Same value as the `Retry-After` header, for `rate_limited`.
        required_step_up:
          type: string
          enum:
          - 5min
          - 10min
          description: Freshness the caller must reach, for `step_up_required`.
        current_version:
          type: integer
          minimum: 1
          description: Current `version_no`, only for `version_conflict` on a resource the caller may edit.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MasjidSearchHit'
          description: Nearby listings, only for `duplicate_nearby`.
      required:
      - type
      - title
      - status
      - code
      - request_id
      description: RFC 9457 problem details (`application/problem+json`). A resource that does not exist and a resource the caller may not see produce the same status, code and body shape (`404 not_found`), so existence never leaks.
    TermsAcceptance:
      type: object
      properties:
        admin_terms:
          $ref: '#/components/schemas/TermsVersion'
        privacy_notice:
          $ref: '#/components/schemas/TermsVersion'
      required:
      - admin_terms
      - privacy_notice
      description: Versions the person accepted (`terms_acceptance`, data-model section 4).
      additionalProperties: false
    SignUpRequest:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        locale:
          $ref: '#/components/schemas/Locale'
        accepted_terms:
          $ref: '#/components/schemas/TermsAcceptance'
      required:
      - email
      - password
      - accepted_terms
      additionalProperties: false
    AcceptedResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - accepted
      required:
      - status
      description: Uniform body for requests that must not reveal whether an account or a match exists.
    VerifyTokenRequest:
      type: object
      properties:
        token:
          $ref: '#/components/schemas/OneTimeToken'
      required:
      - token
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        enrolment_token:
          allOf:
          - $ref: '#/components/schemas/OneTimeToken'
          description: One-time enrolment link token (10 minutes). Required only when the account has no active authenticator after a second-factor reset or a break-glass recovery.
      required:
      - email
      - password
      additionalProperties: false
    LoginStepResponse:
      type: object
      properties:
        next:
          type: string
          enum:
          - totp
          - mfa_enrolment
        second_factors:
          type: array
          items:
            type: string
            enum:
            - totp
            - recovery_code
        expires_in:
          type: integer
          description: Seconds the `__Host-pa` challenge cookie stays valid (300).
      required:
      - next
      - expires_in
      description: Password accepted. The server set the 5-minute single-purpose `__Host-pa` cookie; no session exists yet.
    TotpRequest:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/TotpCode'
      required:
      - code
      additionalProperties: false
    RecoveryCodeRequest:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/RecoveryCode'
      required:
      - code
      additionalProperties: false
    MembershipSummary:
      type: object
      properties:
        masjid_id:
          $ref: '#/components/schemas/MasjidId'
        role:
          $ref: '#/components/schemas/MembershipRole'
        primary_name:
          type: string
      required:
      - masjid_id
      - role
    AccountSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        kind:
          $ref: '#/components/schemas/AccountKind'
        status:
          $ref: '#/components/schemas/AccountStatus'
        locale:
          $ref: '#/components/schemas/Locale'
        email_verified:
          type: boolean
        mfa_enrolled:
          type: boolean
        operator_roles:
          type: array
          items:
            $ref: '#/components/schemas/OperatorRole'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
      required:
      - id
      - email
      - kind
      - status
      - email_verified
      - mfa_enrolled
      description: Own account only. Never contains password hashes, TOTP secrets, recovery codes or wrapped data keys.
    SessionTimes:
      type: object
      properties:
        created_at:
          $ref: '#/components/schemas/Timestamp'
        idle_expires_at:
          $ref: '#/components/schemas/Timestamp'
        absolute_expires_at:
          $ref: '#/components/schemas/Timestamp'
        step_up_until:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: string
            nullable: true
            enum:
            - null
      required:
      - created_at
      - idle_expires_at
      - absolute_expires_at
      description: 'Timeouts per R-09: Muazzin and Admin idle 30 min and absolute 12 h; reviewer and moderator 15 min and 8 h; super-admin 10 min and 4 h.'
    SessionStarted:
      type: object
      properties:
        csrf_token:
          type: string
          description: Synchroniser token bound to this session. Keep it in JS memory only; send it as `X-CSRF-Token` on every unsafe request.
        account:
          $ref: '#/components/schemas/AccountSummary'
        session:
          $ref: '#/components/schemas/SessionTimes'
      required:
      - csrf_token
      - account
      - session
      description: A new session was created. The `__Host-sid` cookie arrives in `Set-Cookie`; the id is rotated at login, step-up and role change.
    SessionInfo:
      type: object
      properties:
        authenticated:
          type: boolean
        mfa_verified:
          type: boolean
        csrf_token:
          type: string
        account:
          anyOf:
          - $ref: '#/components/schemas/AccountSummary'
          - type: object
            nullable: true
            enum:
            - null
        session:
          anyOf:
          - $ref: '#/components/schemas/SessionTimes'
          - type: object
            nullable: true
            enum:
            - null
      required:
      - authenticated
      - mfa_verified
      - csrf_token
      description: 'Current session state and the CSRF token. Anonymous callers get `authenticated: false` and a token that is valid only for the pre-auth routes.'
    SessionView:
      type: object
      properties:
        handle:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        user_agent_family:
          type: string
          maxLength: 60
          description: Browser family only, for example `Firefox 150`; no address is exposed.
        current:
          type: boolean
      required:
      - handle
      - created_at
      - last_seen_at
      - current
    MfaEnrolStart:
      type: object
      properties:
        otpauth_uri:
          type: string
          format: uri
          description: '`otpauth://totp/...` URI for the QR code. Shown once.'
        secret_base32:
          type: string
          description: Same secret for manual entry. Shown once; stored encrypted (AES-256-GCM).
        issuer:
          type: string
        algorithm:
          type: string
          enum:
          - SHA1
        digits:
          type: integer
          enum:
          - 6
        period:
          type: integer
          enum:
          - 30
      required:
      - otpauth_uri
      - secret_base32
      - issuer
      - algorithm
      - digits
      - period
    MfaEnrolled:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryCode'
          minItems: 10
          maxItems: 10
          description: Ten single-use codes, shown exactly once. Only Argon2id hashes are stored.
        csrf_token:
          type: string
        account:
          $ref: '#/components/schemas/AccountSummary'
        session:
          $ref: '#/components/schemas/SessionTimes'
      required:
      - recovery_codes
      - csrf_token
      - account
      - session
    RecoveryCodesResponse:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryCode'
          minItems: 10
          maxItems: 10
        generated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - recovery_codes
      - generated_at
      description: A new set replaces and invalidates the old one. Shown once.
    StepUpRequest:
      type: object
      properties:
        password:
          $ref: '#/components/schemas/Password'
        code:
          $ref: '#/components/schemas/TotpCode'
      required:
      - password
      - code
      description: Password plus a fresh TOTP (a code of a time step not used before). Operators stay fresh 5 minutes, admins and Muazzins 10 minutes.
      additionalProperties: false
    StepUpResponse:
      type: object
      properties:
        step_up_until:
          $ref: '#/components/schemas/Timestamp'
        csrf_token:
          type: string
          description: Rotated with the session id.
      required:
      - step_up_until
      - csrf_token
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          $ref: '#/components/schemas/Password'
        new_password:
          $ref: '#/components/schemas/Password'
      required:
      - current_password
      - new_password
      additionalProperties: false
    PasswordChanged:
      type: object
      properties:
        csrf_token:
          type: string
        other_sessions_closed:
          type: integer
          minimum: 0
      required:
      - csrf_token
      - other_sessions_closed
      description: All other sessions are closed (`session_epoch` + 1) and the current session id is rotated.
    PasswordResetRequest:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/Email'
      required:
      - email
      additionalProperties: false
    PasswordResetLinkOpened:
      type: object
      properties:
        next:
          type: string
          enum:
          - second_factor
        second_factors:
          type: array
          items:
            type: string
            enum:
            - totp
            - recovery_code
        expires_in:
          type: integer
          description: Seconds left to finish the flow (600).
      required:
      - next
      - expires_in
    PasswordResetMfaRequest:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/TotpCode'
        recovery_code:
          $ref: '#/components/schemas/RecoveryCode'
      description: Exactly one of `code` or `recovery_code`. A reset never bypasses the second factor (ASVS 6.4.3).
      oneOf:
      - required:
        - code
      - required:
        - recovery_code
      additionalProperties: false
    PasswordResetMfaVerified:
      type: object
      properties:
        next:
          type: string
          enum:
          - set_password
        expires_in:
          type: integer
      required:
      - next
      - expires_in
    PasswordResetCompleteRequest:
      type: object
      properties:
