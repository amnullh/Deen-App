      description: |-
        The only way to read evidence; there are no URLs or presigned links. Checks, in order: session and MFA, resource scope (404), role reviewer or super-admin, assigned to this open case, step-up within 5 minutes. It then writes `evidence.view_start` inside a transaction (fail-closed: no audit row, no decryption), unwraps the data key, decrypts, verifies the tag and streams the WebP. 60 views per minute per Operator; more than 25 distinct cases a day raises an insider alert. The console overlays the Operator id as a watermark and revokes the blob URL on close.

        Host: `console`. Roles: `reviewer`, `super_admin`. Scope: `assignedCase`. MFA: required. Step-up: 5min. Audit: `evidence.view_start`. The read itself is audited.
