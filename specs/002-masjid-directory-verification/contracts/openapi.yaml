# Deen App Phase 1 HTTP contract (OpenAPI 3.0.3). Single source of truth: edit this file directly.
# contracts/authz-matrix.md is generated from its x- extensions; contracts/examples/*.json are validated against it.
openapi: 3.0.3
info:
  title: Deen App Phase 1 API
  version: 1.0.0-draft.1
  description: |-
    HTTP contract of the optional Deen App server, Phase 1: Masjid directory, claim and verification, Masjid schedules, operator console. Single source for server routes (`fastify-openapi-glue`, routes from `operationId`), generated types and contract tests (Ajv over `examples/*.json`, Schemathesis). Listener reads are static files and are NOT here (contracts/static-files.md); this API serves admins, Muazzins and Operators, plus two listener writes.

    **Hosts.** Every route is under `/v1`. `https://console.{domain}` serves everything except `/v1/public/*`; `https://api.{domain}` serves ONLY `/v1/public/*` (no cookies). Each operation has `x-host: console|api`.

    **Security model.**
    - Email, password (Argon2id) and an authenticator code for every account kind; no SMS, social sign-in, bearer token, JWT or OAuth. Only the pre-auth and public routes are `x-mfa: not-required`.
    - Session: opaque id in the `__Host-sid` cookie (`Secure; HttpOnly; SameSite=Strict`, no Domain), stateful in Valkey, rotated at login, step-up and role change. After the password step a 5-minute `__Host-pa` cookie (apiKey in cookie, `Secure; HttpOnly; SameSite=Strict`) carries the sign-in, enrolment or reset flow; it is never a session and no bearer token exists.
    - CSRF: unsafe methods need `X-CSRF-Token` (from `GET /v1/session`), an exact `Origin`, and `application/json` (`multipart/form-data` on the two upload routes). Pre-auth routes use the Origin check and `__Host-pa` (`x-csrf: origin-only`).
    - Authorization is deny by default. Each operation declares `x-roles`, `x-scope` (global, ownMasjid, assignedCase, self), `x-mfa`, `x-step-up` (none, 5min, 10min; Operators 5 minutes, admins 10), `x-audit-action`, `x-rate-limit` and `x-host`; event-firing operations add `x-events`. contracts/authz-matrix.md is generated from them.
    - No existence leaks: another Masjid's resource and a missing one return the same `404 not_found`; sign-in, sign-up, password reset and the public writes answer identically and in comparable time whether or not an account or a match exists.
    - Errors are RFC 9457 `application/problem+json` (`Error`) with stable codes and `request_id`; `Retry-After` on 429. Writes to versioned resources need `If-Match` (412 or 409 `version_conflict`, 428 when missing). Lists are cursor-paged (`cursor`, `limit`).
    - Every authenticated response is `Cache-Control: no-store`. Committee contacts, evidence images, password hashes, TOTP secrets, recovery codes and wrapped keys never appear in a list or an entity view. Every state change maps to a state-machines.md event (`x-events`) and audit action; system events have no route.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://console.{domain}
  description: 'Console origin: the operator console and every /v1 route except /v1/public/*.'
  variables:
    domain:
      default: deen.example
      description: Registrable domain of the deployment.
- url: https://api.{domain}
  description: 'Listener write origin: /v1/public/* only, no cookies.'
  variables:
    domain:
      default: deen.example
      description: Registrable domain of the deployment.
tags:
- name: auth
  description: Sign-up, sign-in with a second factor, sessions, step-up and password reset.
- name: account
  description: 'Own account: email change, own-data export, account deletion request.'
- name: masjids
  description: Masjid search, profile, names, location, photos, versions, invitations, members, ownership transfer and the Masjid-scoped audit log.
- name: schedules
  description: 'Masjid prayer-time rules: read, replace, validate, preview 14 days, versions and rollback.'
- name: claims
  description: 'Claim and verification, seen from the claimant: submit, evidence, committee contacts, status, appeal, withdraw, early deletion.'
- name: operator-review
  description: Operator review queue, evidence and committee-contact access, calls, decisions, appeals, arbitration and ownership-transfer approval.
- name: operator-moderation
  description: Suspend, revoke and reinstate; abuse reports; suggestions; duplicate candidates.
- name: operator-directory
  description: OpenStreetMap import batches and hand-curated entries.
- name: operator-admin
  description: Global search, audit log, privacy requests, SC-002 and SC-008 dashboards, Operator accounts and roles.
- name: recovery
  description: Second-factor reset and break-glass recovery (user side and Operator side).
- name: public
  description: 'Listener writes on the api host: suggestions, abuse reports and the proof-of-work challenge.'
- name: ops
  description: Liveness and readiness probes.
paths:
  /v1/auth/sign-up:
    post:
      tags:
      - auth
      summary: Sign up as a Masjid admin
      operationId: signUp
      description: |-
        Creates an `admin` account in `pending_mfa` and mails a verification link. Always answers 202 with the same body and about the same timing, whether or not the address is already registered; an existing address receives a mail saying so (no enumeration). Muazzins and co-admins join through invitations, Operators are created by a super-admin. After the link is verified the person signs in and must enrol an authenticator before anything else works (US3.1).

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `account.created`. State-machine events: `account.create`. Uniform timing: the response and the work done are the same for known and unknown accounts, so neither the body nor the latency reveals whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            examples:
              default:
                summary: Example
                externalValue: examples/signUp.request.json
      responses:
        '202':
          description: Accepted. Uniform body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              examples:
                default:
                  summary: Example
                  externalValue: examples/requestPasswordReset.response.202.json
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      x-host: console
      x-roles:
      - public
      x-scope: self
      x-mfa: not-required
      x-step-up: none
      x-audit-action: account.created
      x-rate-limit: reset_email
      x-auth: none
      x-csrf: origin-only
      x-events:
      - account.create
      x-uniform-timing: true
  /v1/auth/email/verify:
    post:
      tags:
      - auth
      summary: Verify an email address from a mailed link
      operationId: verifyEmail
      description: |-
        Completes sign-up verification, or an email change started by `changeEmail`. The token is POSTed (never in a GET query) and is single use.

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `auth.email_verified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTokenRequest'
      responses:
        '204':
          description: Verified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      x-host: console
      x-roles:
      - public
      x-scope: self
      x-mfa: not-required
      x-step-up: none
      x-audit-action: auth.email_verified
      x-audit-action-proposed: true
      x-rate-limit: login
      x-auth: none
      x-csrf: origin-only
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: 'Sign in, step 1: email and password'
      operationId: login
      description: |-
        Checks the password with Argon2id. An unknown address, a wrong password, a locked account and a disabled account all return the same 401 `invalid_credentials` after the same work (a dummy hash runs for unknown addresses). On success no session exists yet: the 5-minute `__Host-pa` challenge cookie is set and the client continues with `verifyTotp` or `verifyRecoveryCodeLogin` (or, for `mfa_enrolment`, with the enrolment routes). Failed attempts are throttled: 5 per 15 minutes per account and 20 per 15 minutes per address with a doubling cool-off to 24 hours; Operators lock after 10 until a super-admin unlocks them.

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `auth.login_failed`. Audit: `auth.login_failed` on a wrong password; the success of the whole sign-in is `auth.login_ok`, written by the second-factor step. Uniform timing: the response and the work done are the same for known and unknown accounts, so neither the body nor the latency reveals whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                summary: Example
                externalValue: examples/login.request.json
      responses:
        '200':
          description: Success.
          headers:
            Set-Cookie:
              description: '`__Host-pa=<opaque>; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=300`: single-purpose pre-auth challenge, never a session.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStepResponse'
              examples:
                default:
                  summary: Example
                  externalValue: examples/login.response.200.json
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      x-host: console
      x-roles:
      - public
      x-scope: self
      x-mfa: not-required
      x-step-up: none
      x-audit-action: auth.login_failed
      x-rate-limit: login
      x-auth: none
      x-csrf: origin-only
      x-uniform-timing: true
  /v1/auth/login/totp:
    post:
      tags:
      - auth
      summary: 'Sign in, step 2: authenticator code'
      operationId: verifyTotp
      description: |-
        Verifies a TOTP code (window zero, single use per time step) against the pre-auth challenge and starts the session. The session id is new; the CSRF token for later unsafe requests comes in the body. A wrong code is `401 invalid_credentials`; 5 failures per 5 minutes per challenge and 10 per hour per account.

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `auth.login_ok`. Audit: `auth.login_ok` on success, `auth.mfa_failed` on a wrong code. Uniform timing: the response and the work done are the same for known and unknown accounts, so neither the body nor the latency reveals whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpRequest'
      responses:
        '200':
          description: Success.
          headers:
            Set-Cookie:
              description: '`__Host-sid=<opaque 256-bit id>; Path=/; Secure; HttpOnly; SameSite=Strict`. No `Domain` attribute. A new id is issued at login, step-up and role change.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStarted'
              examples:
                default:
                  summary: Example
                  externalValue: examples/verifyTotp.response.200.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - preAuthChallenge: []
      x-host: console
      x-roles:
      - public
      x-scope: self
      x-mfa: not-required
      x-step-up: none
      x-audit-action: auth.login_ok
      x-rate-limit: totp_code
      x-auth: pre-auth
      x-csrf: origin-only
      x-uniform-timing: true
  /v1/auth/login/recovery-code:
    post:
      tags:
      - auth
      summary: 'Sign in, step 2 alternative: recovery code'
      operationId: verifyRecoveryCodeLogin
      description: |-
        Uses one of the ten recovery codes instead of a TOTP code. The code is consumed (Argon2id-hashed, single use) and a notice is mailed to the account. The session is a normal MFA-verified session; the console then nudges the person to regenerate codes.

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `auth.recovery_code_used`. Uniform timing: the response and the work done are the same for known and unknown accounts, so neither the body nor the latency reveals whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodeRequest'
      responses:
        '200':
          description: Success.
          headers:
            Set-Cookie:
              description: '`__Host-sid=<opaque 256-bit id>; Path=/; Secure; HttpOnly; SameSite=Strict`. No `Domain` attribute. A new id is issued at login, step-up and role change.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStarted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - preAuthChallenge: []
      x-host: console
      x-roles:
      - public
      x-scope: self
      x-mfa: not-required
      x-step-up: none
      x-audit-action: auth.recovery_code_used
      x-rate-limit: totp_code
      x-auth: pre-auth
      x-csrf: origin-only
      x-uniform-timing: true
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Sign out the current session
      operationId: logout
      description: |-
        Deletes the session record and clears the `__Host-sid` cookie.

        Host: `console`. Roles: `muazzin`, `admin`, `reviewer`, `moderator`, `super_admin`. Scope: `self`. MFA: required. Step-up: none. Audit: `auth.session_terminated`.
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - cookieSession: []
        csrfToken: []
      x-host: console
      x-roles:
      - muazzin
      - admin
      - reviewer
      - moderator
      - super_admin
      x-scope: self
      x-mfa: required
      x-step-up: none
      x-audit-action: auth.session_terminated
      x-rate-limit: authenticated_api
      x-auth: session
      x-csrf: token
  /v1/session:
    get:
      tags:
      - auth
      summary: Read the current session and fetch the CSRF token
      operationId: getSession
      description: |-
        `GET /v1/session` is the one route that works with or without a session. It returns the state the console needs to choose a screen and the `X-CSRF-Token` value for unsafe requests. Anonymous callers get `authenticated: false` and a token usable only on the pre-auth routes. The minimum supported app version is NOT here: it is a field of the static manifest (research R-29).

        Host: `console`. Roles: `public`, `muazzin`, `admin`, `reviewer`, `moderator`, `super_admin`. Scope: `self`. MFA: not-required. Step-up: none. Audit: none.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              examples:
                default:
                  summary: Example
                  externalValue: examples/getSession.response.200.json
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - {}
      - cookieSession: []
      x-host: console
      x-roles:
      - public
      - muazzin
      - admin
      - reviewer
      - moderator
      - super_admin
      x-scope: self
      x-mfa: not-required
      x-step-up: none
      x-audit-action: none
      x-rate-limit: authenticated_api
      x-auth: optional-session
      x-csrf: not-applicable
  /v1/auth/sessions:
    get:
      tags:
      - auth
      summary: List own active sessions
      operationId: listSessions
      description: |-
        At most 5 sessions for admins and Muazzins, 2 for Operators (the oldest is evicted). Only coarse browser family and times are shown; no address.

        Host: `console`. Roles: `muazzin`, `admin`, `reviewer`, `moderator`, `super_admin`. Scope: `self`. MFA: required. Step-up: none. Audit: none.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - cookieSession: []
      x-host: console
      x-roles:
      - muazzin
      - admin
      - reviewer
      - moderator
      - super_admin
      x-scope: self
      x-mfa: required
      x-step-up: none
      x-audit-action: none
      x-rate-limit: authenticated_api
      x-auth: session
      x-csrf: not-applicable
  /v1/auth/sessions/{sessionHandle}:
    delete:
      tags:
      - auth
      summary: Terminate one of the own sessions
      operationId: terminateSession
      description: |-
        Deletes the session record. A handle that is not one of the caller's own sessions answers 404 exactly like a missing one.

        Host: `console`. Roles: `muazzin`, `admin`, `reviewer`, `moderator`, `super_admin`. Scope: `self`. MFA: required. Step-up: none. Audit: `auth.session_terminated`.
      parameters:
      - $ref: '#/components/parameters/SessionHandlePath'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - cookieSession: []
        csrfToken: []
      x-host: console
      x-roles:
      - muazzin
      - admin
      - reviewer
      - moderator
      - super_admin
      x-scope: self
      x-mfa: required
      x-step-up: none
      x-audit-action: auth.session_terminated
      x-rate-limit: authenticated_api
      x-auth: session
      x-csrf: token
  /v1/auth/mfa/enrol/start:
    post:
      tags:
      - auth
      summary: Start authenticator enrolment
      operationId: startMfaEnrolment
      description: |-
        For an account in `pending_mfa` holding a pre-auth challenge. Returns a new TOTP secret (SHA-1, 6 digits, 30 s) and the `otpauth://` URI, shown once; a repeated start replaces the unconfirmed secret. Nothing works until `confirmMfaEnrolment` succeeds (FR-004). No SMS and no social sign-in exist.

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: none. No state change until confirmed; the unconfirmed secret row is not audited.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrolStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - preAuthChallenge: []
      x-host: console
      x-roles:
      - public
      x-scope: self
      x-mfa: not-required
      x-step-up: none
      x-audit-action: none
      x-rate-limit: login
      x-auth: pre-auth
      x-csrf: origin-only
  /v1/auth/mfa/enrol/confirm:
    post:
      tags:
      - auth
      summary: Confirm enrolment and receive the recovery codes
      operationId: confirmMfaEnrolment
      description: |-
        Verifies a code from the new secret, activates the factor, rotates to a full session and returns the ten recovery codes exactly once (printable). The account moves `pending_mfa` to `active`.

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `auth.mfa_enrolled`. State-machine events: `account.enrol_mfa`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpRequest'
      responses:
        '200':
          description: Success.
          headers:
            Set-Cookie:
              description: '`__Host-sid=<opaque 256-bit id>; Path=/; Secure; HttpOnly; SameSite=Strict`. No `Domain` attribute. A new id is issued at login, step-up and role change.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrolled'
              examples:
                default:
                  summary: Example
                  externalValue: examples/confirmMfaEnrolment.response.200.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - preAuthChallenge: []
      x-host: console
      x-roles:
      - public
      x-scope: self
      x-mfa: not-required
      x-step-up: none
      x-audit-action: auth.mfa_enrolled
      x-rate-limit: totp_code
      x-auth: pre-auth
      x-csrf: origin-only
      x-events:
      - account.enrol_mfa
  /v1/auth/mfa/recovery-codes:
    post:
      tags:
      - auth
      summary: Replace the recovery codes
      operationId: regenerateRecoveryCodes
      description: |-
        Generates a new set of ten codes and invalidates the old set. The new codes are shown once. Needs a fresh step-up.

        Host: `console`. Roles: `muazzin`, `admin`, `reviewer`, `moderator`, `super_admin`. Scope: `self`. MFA: required. Step-up: 10min. Audit: `auth.recovery_codes_regenerated`.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - cookieSession: []
        csrfToken: []
      x-host: console
      x-roles:
      - muazzin
      - admin
      - reviewer
      - moderator
      - super_admin
      x-scope: self
      x-mfa: required
      x-step-up: 10min
      x-step-up-by-role:
        reviewer: 5min
        moderator: 5min
        super_admin: 5min
      x-audit-action: auth.recovery_codes_regenerated
      x-rate-limit: authenticated_api
      x-auth: session
      x-csrf: token
  /v1/auth/step-up:
    post:
      tags:
      - auth
      summary: Re-authenticate with password and a fresh TOTP
      operationId: stepUp
      description: |-
        Proves the password and a TOTP code of a time step not used before. The session id is rotated and `step_up_until` moves forward 5 minutes (Operators) or 10 minutes (admins, Muazzins). Routes that need it answer `403 step_up_required` otherwise.

        Host: `console`. Roles: `muazzin`, `admin`, `reviewer`, `moderator`, `super_admin`. Scope: `self`. MFA: required. Step-up: none. Audit: `auth.step_up_ok`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
            examples:
              default:
                summary: Example
                externalValue: examples/stepUp.request.json
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - cookieSession: []
