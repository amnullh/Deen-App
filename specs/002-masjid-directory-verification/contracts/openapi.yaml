          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
          - bounced_address
          - hold_review
          - osm_vanished
          - orphaned_listing
          - reassign_case
          - recovery_request
          - privacy_overdue
          - suspension_flag
        masjid_id:
          anyOf:
          - $ref: '#/components/schemas/MasjidId'
          - type: string
            nullable: true
            enum:
            - null
        subject_id:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - open
          - done
          - cancelled
        due_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: string
            nullable: true
            enum:
            - null
        assignee:
          anyOf:
          - $ref: '#/components/schemas/ActorLabel'
          - type: object
            nullable: true
            enum:
            - null
        note:
          type: string
          nullable: true
          maxLength: 500
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - kind
      - status
      - created_at
