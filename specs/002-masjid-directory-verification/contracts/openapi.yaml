          description: Success.
          headers:
            Set-Cookie:
              description: '`__Host-pa=<opaque>; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=300`: single-purpose pre-auth challenge, never a session.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLinkOpened'
