        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - cookieSession: []
        csrfToken: []
      x-host: console
      x-roles:
      - admin
      x-scope: ownMasjid
      x-mfa: required
      x-step-up: none
      x-audit-action: schedule.edited
      x-rate-limit: authenticated_api
      x-auth: session
      x-csrf: token
