              description: '`inline; filename="evidence-<n>.webp"` (server-chosen name).'
              schema:
                type: string
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
            Content-Security-Policy:
              description: '`sandbox`'
              schema:
                type: string
            X-Content-Type-Options:
              description: '`nosniff`'
              schema:
                type: string
            Cross-Origin-Resource-Policy:
              description: '`same-site`'
              schema:
