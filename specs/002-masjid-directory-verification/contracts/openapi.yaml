  /v1/claims/{claimId}/submit:
    post:
      tags:
      - claims
      summary: Submit a claim, or answer a request for information
      operationId: submitClaim
      description: |-
        From Draft the claim needs `evidence_ok` (a committee or trust document, an authorization letter, a building photo, two distinct committee contacts, every file sanitised) and routes to one of three outcomes: `submitted` (clear), `conflicted` (another active or Verified claim by someone else: both are held and neither has edit rights until arbitration; the response does not say who the other is) or `rejected_final` with REJ-IDENTICAL-EVIDENCE (the sanitised evidence fingerprint equals one stored from a merit rejection; no appeal). From `needs_info` the same call is the `respond` event and needs at least one new file or a message. The 409 body names the failed guard.

        Host: `console`. Roles: `admin`. Scope: `self`. MFA: required. Step-up: none. Audit: `claim.submitted`, `claim.conflicted`, `claim.rejected_identical`, `claim.info_provided`. State-machine events: `claim.submit`, `claim.respond`. System events fired in the same transaction: `listing.claim_submitted`, `claim.conflict_open`, `conflict.open`, `conflict.join`.
