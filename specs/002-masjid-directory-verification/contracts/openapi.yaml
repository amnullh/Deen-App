      description: 'Jumu''ah shift: Azaan form, optional khutbah start, language tag.'
      additionalProperties: false
    ScheduleRange:
      type: object
      properties:
        f:
          type: string
          pattern: ^([0-9]{4}-)?(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
          description: 'First day, inclusive: `MM-DD` (yearly) or `YYYY-MM-DD` (one period).'
        t:
          type: string
          pattern: ^([0-9]{4}-)?(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
        p:
          $ref: '#/components/schemas/ScheduleDayPrayers'
        j:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleJumuahShift'
          minItems: 1
          maxItems: 4
      required:
      - f
      - t
      - p
      additionalProperties: false
    ScheduleRulesInput:
      type: object
      properties:
        tz:
          type: string
          minLength: 3
          maxLength: 40
          description: IANA zone; the Masjid zone, never the phone zone.
        r:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRange'
          minItems: 1
          maxItems: 12
      required:
      - tz
      - r
      description: 'Writer form of the `masjid-schedule/1` record: the server fills `id`, `rev` and `upd`. Ranges must cover every day once (yearly) or join without gap (dated).'
      additionalProperties: false
    ScheduleRules:
      type: object
      properties:
        fmt:
          type: string
          enum:
          - masjid-schedule/1
        id:
          $ref: '#/components/schemas/MasjidId'
        tz:
          type: string
        rev:
          type: integer
          minimum: 1
        upd:
          $ref: '#/components/schemas/Timestamp'
        r:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRange'
          minItems: 1
          maxItems: 12
      required:
      - id
      - tz
      - rev
      - r
      description: The published rules record (contracts/schedule-rules.md section 2). The phone expands it; the server expands only to validate and to preview.
    ScheduleView:
      type: object
      properties:
        masjid_id:
          $ref: '#/components/schemas/MasjidId'
        schema_id:
          type: string
          enum:
          - masjid-schedule/1
        time_zone:
          type: string
          nullable: true
        rules:
          anyOf:
          - $ref: '#/components/schemas/ScheduleRules'
          - type: object
            nullable: true
            enum:
            - null
        revision:
          type: integer
          minimum: 0
          description: 0 when no schedule exists yet.
        version_no:
          type: integer
          minimum: 0
          description: Optimistic lock; also the `ETag` of this response. Use `"0"` in `If-Match` to create the first schedule.
        tzdata_version:
          type: string
          example: 2026e
        rules_sha256:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
        updated_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: string
            nullable: true
            enum:
            - null
      required:
      - masjid_id
      - schema_id
      - revision
      - version_no
    ScheduleIssue:
      type: object
      properties:
        code:
          type: string
          enum:
          - schema_invalid
          - bad_version
          - unknown_zone
          - bad_time_format
          - bad_date
          - range_overlap
          - range_gap
          - range_mixed_forms
          - too_many_ranges
          - offset_out_of_range
          - bad_rounding
          - iqamah_before_azaan
          - iqamah_crosses_midnight
          - azaan_crosses_midnight
          - prayer_order
          - jumuah_not_friday
          - too_many_shifts
          - empty_shift_list
          - calc_settings_missing
          - time_in_dst_gap
          - time_in_dst_overlap
          - iqamah_gap_unusual
          - fajr_after_sunrise
          - khutbah_before_azaan
          - jumuah_missing
          - jumuah_shifts_close
          - calc_polar_null
          - range_ends_soon
        severity:
          type: string
          enum:
          - error
          - warning
        path:
          type: string
          example: r[0].p.is.i
        message_key:
          type: string
        args:
          type: object
          additionalProperties: true
      required:
      - code
      - severity
      - path
      - message_key
      description: 'Codes and severities exactly as contracts/schedule-rules.md section 6. Errors: schema_invalid, bad_version, unknown_zone, bad_time_format, bad_date, range_overlap, range_gap, range_mixed_forms, too_many_ranges, offset_out_of_range, bad_rounding, iqamah_before_azaan, iqamah_crosses_midnight, azaan_crosses_midnight, prayer_order, jumuah_not_friday, too_many_shifts, empty_shift_list, calc_settings_missing. Warnings: time_in_dst_gap, time_in_dst_overlap, iqamah_gap_unusual, fajr_after_sunrise, khutbah_before_azaan, jumuah_missing, jumuah_shifts_close, calc_polar_null, range_ends_soon.'
    ScheduleValidateRequest:
      type: object
      properties:
        rules:
          $ref: '#/components/schemas/ScheduleRulesInput'
      required:
      - rules
      additionalProperties: false
    ScheduleValidationResult:
      type: object
      properties:
        valid:
          type: boolean
          description: True when there is no issue with severity `error`.
        tzdata_version:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleIssue'
      required:
      - valid
      - tzdata_version
      - issues
    ScheduleReplaceRequest:
      type: object
      properties:
        rules:
          $ref: '#/components/schemas/ScheduleRulesInput'
        note:
          type: string
          maxLength: 500
      required:
      - rules
      description: Full replacement. Any issue with severity `error` gives 422 `schedule_invalid` and changes nothing; warnings are returned with the saved schedule.
      additionalProperties: false
    ScheduleSaved:
      type: object
      properties:
        schedule:
          $ref: '#/components/schemas/ScheduleView'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleIssue'
      required:
      - schedule
      - warnings
    SchedulePreviewRequest:
      type: object
      properties:
        rules:
          $ref: '#/components/schemas/ScheduleRulesInput'
        calc_settings:
          allOf:
          - $ref: '#/components/schemas/CalcSettings'
          description: Optional unsaved override of the profile calculation settings for this preview only.
        from_date:
          allOf:
          - $ref: '#/components/schemas/DateOnly'
          description: First local date in the Masjid zone; default today there.
      required:
      - rules
      description: Previews unsaved rules for 14 consecutive local dates, expanded by the shared Dart-compiled expander. Calculated forms need the Masjid coordinates and the profile calculation method, else the result carries `calc_settings_missing`.
      additionalProperties: false
    ScheduleDay:
      type: object
      properties:
        date:
          $ref: '#/components/schemas/DateOnly'
        range_index:
          type: integer
          nullable: true
          description: Index of the range used; null when the day falls back to calculated times.
        azaan:
          type: object
          properties:
            fajr:
              type: string
              format: date-time
              nullable: true
            dhuhr:
              type: string
              format: date-time
              nullable: true
            asr:
              type: string
              format: date-time
              nullable: true
            maghrib:
              type: string
              format: date-time
              nullable: true
            isha:
              type: string
              format: date-time
              nullable: true
        iqamah:
          type: object
          properties:
            fajr:
              type: string
              format: date-time
              nullable: true
            dhuhr:
              type: string
              format: date-time
              nullable: true
            asr:
              type: string
              format: date-time
              nullable: true
            maghrib:
              type: string
              format: date-time
              nullable: true
            isha:
              type: string
              format: date-time
              nullable: true
        jumuah:
          type: array
          items:
            type: object
            properties:
              azaan:
                $ref: '#/components/schemas/Timestamp'
              khutbah:
                anyOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: string
                  nullable: true
                  enum:
                  - null
              lang:
                type: string
                nullable: true
            required:
            - azaan
        flags:
          type: object
          properties:
            gap_shifted:
              type: array
              items:
                $ref: '#/components/schemas/Prayer'
            invalid_rule:
              type: array
              items:
                $ref: '#/components/schemas/Prayer'
      required:
      - date
      - azaan
      - iqamah
      - jumuah
      - flags
      description: One expanded local day. Instants are UTC. `jumuah` is empty except on a local Friday (E9).
    SchedulePreview:
      type: object
      properties:
        time_zone:
          type: string
        tzdata_version:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleDay'
          minItems: 14
          maxItems: 14
        issues:
          type: array
