      description: |-
        Always 202 with the same body and timing. A row, a 256-bit token and a mail exist only if the account does (link valid 10 minutes, single use, a newer request voids older ones). 3 per hour per address and 10 per hour per source. A reset never bypasses the second factor.

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `recovery.password_reset.requested`. State-machine events: `password_reset.request`. Uniform timing: the response and the work done are the same for known and unknown accounts, so neither the body nor the latency reveals whether an account exists.
