        - country_code
        - proposed_name
        - proposed_address
        - terms_version
        - pow
      description: 'Listener write (research R-17). `correction`: existing Masjid id plus text. `new_masjid`: 5 km cell id, country, free-text name and address, accepted contribution terms. NO coordinates, no device or listener identifier, no IP is stored. An Operator places the pin on accept. The reply never reveals whether anything matched.'
