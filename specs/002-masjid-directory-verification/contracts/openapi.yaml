    post:
      tags:
      - operator-review
      summary: 'Decide a claim: verify, need more information, reject'
      operationId: decideClaim
      description: |-
        Assignee only, with step-up and a required reason code and sentence. `verify` (VER-*) needs a C1 call, the second look when required, no Suspended listing and no open conflict; it sets `verified_until` to the decision plus 12 months, makes the admin a member, supersedes any older Verified claim and marks the pack cells dirty. `request_info` (NMI-*) starts a 30-day clock. `reject` (REJ-*) starts the 30-day appeal window and the 90-day evidence clock; a merit rejection stores a 12-month fingerprint. The 409 body names a failed guard such as `call_ok`, `second_look_ok` or `listing_not_suspended`.

        Host: `console`. Roles: `reviewer`, `super_admin`. Scope: `assignedCase`. MFA: required. Step-up: 5min. Audit: `claim.verified`, `claim.info_requested`, `claim.rejected`. State-machine events: `claim.verify`, `claim.request_info`, `claim.reject`. System events fired in the same transaction: `listing.verified`, `claim.supersede`, `listing.claims_closed`.
