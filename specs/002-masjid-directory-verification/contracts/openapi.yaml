            schema:
              $ref: '#/components/schemas/DecideClaimRequest'
            examples:
              verify:
                summary: verify
                externalValue: examples/decideClaim.request.verify.json
              reject:
                summary: reject
                externalValue: examples/decideClaim.request.reject.json
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
              examples:
                default:
                  summary: Example
                  externalValue: examples/decideClaim.response.200.json
