      operationId: respondToInvitation
      description: |-
        Works with or without a session (an optional session: when the cookie is present the CSRF token is required too). `accept` with a session joins the signed-in account (its email must equal the invited address; MFA must be enrolled before the role is usable; a co-admin invitation upgrades a Muazzin to `admin`, and existing admins are told by mail). `accept` without a session needs `password` and `accepted_terms` and creates the account `pending_mfa` (the token already proves the address). `decline` needs no account. A token that is invalid, expired, revoked or for another address answers 400 `token_invalid` without saying which.

        Host: `console`. Roles: `public`, `muazzin`, `admin`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `invitation.accepted`, `invitation.declined`, `account.created`. State-machine events: `invitation.accept`, `invitation.decline`, `account.create`. An accept also writes `member.added`, and `account.kind_changed` for a co-admin invitation to a Muazzin. Uniform timing: the response and the work done are the same for known and unknown accounts, so neither the body nor the latency reveals whether an account exists.
