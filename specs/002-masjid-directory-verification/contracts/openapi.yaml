              default:
                summary: Example
                externalValue: examples/createAbuseReport.request.json
      responses:
        '202':
          description: Accepted. Uniform body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
