      description: |-
        A reviewer or super-admin who is not the initiator (database CHECK `recovery_case_approver_not_initiator`), with step-up, after the call is verified. Approval starts the 48-hour delay (`not_before = approved_at + 48 h`): the admin and every committee contact are mailed at once with a cancel link, reminders follow at 24 h and 1 h, and factor changes on the account are blocked. Execution is a system event after `not_before`; there is no route to shorten the delay.

