      summary: Search listings to claim
      operationId: searchMasjids
      description: |-
        Name search for an admin who wants to claim a Masjid. Returns public base-layer facts and the status badge only (nothing private), so it is the same information the static files already publish. It is not a listener route: the app searches on the phone.

        Host: `console`. Roles: `admin`. Scope: `global`. MFA: required. Step-up: none. Audit: none.
      parameters:
      - name: q
        in: query
        required: true
        description: Text typed by the admin; matched against normalised names.
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - name: country_code
        in: query
        required: false
        description: Narrow to one country.
        schema:
          $ref: '#/components/schemas/CountryCode'
      - $ref: '#/components/parameters/CursorQuery'
      - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasjidSearchHitPage'
              examples:
                default:
                  summary: Example
                  externalValue: examples/searchMasjids.response.200.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - cookieSession: []
      x-host: console
      x-roles:
      - admin
      x-scope: global
      x-mfa: required
      x-step-up: none
      x-audit-action: none
      x-rate-limit: authenticated_api
      x-auth: session
      x-csrf: not-applicable
    post:
      tags:
      - masjids
      - claims
      summary: Create a Masjid and start a claim of kind create
      operationId: createMasjid
      description: |-
        For a Masjid that is not listed. A hidden Masjid (`published_at` null, `source: claimed`) is created after a duplicate check against nearby listings, together with a Draft claim. A nearby candidate gives `409 duplicate_nearby` with the candidates; resend with `confirm_not_duplicate: true` to proceed. Nothing is public until the claim is Verified. The contribution terms for the base-layer fields must be accepted (R-27).

        Host: `console`. Roles: `admin`. Scope: `self`. MFA: required. Step-up: none. Audit: `claim.draft_created`. State-machine events: `claim.create_draft`. Also writes `masjid.created` for the hidden Masjid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
