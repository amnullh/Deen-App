      operationId: openPasswordResetLink
      description: |-
        POST with the token (never GET). Starts a 10-minute flow and sets the `__Host-pa` challenge cookie.

        Host: `console`. Roles: `public`. Scope: `self`. MFA: not-required. Step-up: none. Audit: `recovery.password_reset.link_opened`. State-machine events: `password_reset.open_link`.
