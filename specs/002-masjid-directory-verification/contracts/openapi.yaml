    put:
      tags:
      - schedules
      summary: Replace the schedule rules
      operationId: replaceSchedule
      description: |-
        Validates with the shared Dart-compiled `masjid_schedule` code; any issue with severity `error` gives 422 `schedule_invalid` and changes nothing (no version, no audit row). Warnings are returned with the saved schedule. Needs `If-Match` (use `"0"` for the first schedule). Only the rules are published; the phone expands them (R-06). The schedule goes live at once for a Verified Masjid and is withdrawn when verification lapses. A write on a Masjid with an open conflict whose incumbent an Operator froze answers 409 `guard_failed` (`masjid_frozen`).

        Host: `console`. Roles: `admin`. Scope: `ownMasjid`. MFA: required. Step-up: none. Audit: `schedule.edited`.
