                summary: Example
                externalValue: examples/replaceSchedule.request.json
      responses:
        '200':
          description: Success.
          headers:
            ETag:
              description: Strong ETag equal to the quoted `version_no`, for example `"12"`. Send it back in `If-Match` on the next write.
              schema:
                type: string
          content:
            application/json:
              schema:
