      description: |-
        Wrong information, a fake Masjid or impersonation. Same protections and the same uniform 202 as suggestions. A contact email is kept only if typed and is deleted 30 days after the case closes. Served on `api.<domain>` only: no cookies, no CORS (the listener app is native), no address stored. Rate-limit buckets are an HMAC of the address with a daily-rotating salt, held in Valkey for at most one hour and never written to PostgreSQL, logs or backups (R-17).

