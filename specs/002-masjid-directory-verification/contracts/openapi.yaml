  /v1/public/suggestions:
    post:
      tags:
      - public
      summary: Suggest a correction or a new Masjid
      operationId: createSuggestion
      description: |-
        Listener write with no account. `correction`: an existing Masjid id and text. `new_masjid`: the 5 km cell id (geohash precision 5), ISO country, free-text name and address, and the accepted contribution terms; there are NO coordinates and no identifiers, and an Operator places the pin. A proof-of-work solution (`pow` from `getPowChallenge`) and an empty honeypot field `hp` are required. The reply is always the same 202 body and never reveals whether the Masjid exists, whether a duplicate matched or whether anything was stored. 5 per day per hashed-address bucket; beyond that 429 with `Retry-After`. Served on `api.<domain>` only: no cookies, no CORS (the listener app is native), no address stored. Rate-limit buckets are an HMAC of the address with a daily-rotating salt, held in Valkey for at most one hour and never written to PostgreSQL, logs or backups (R-17).

        Host: `api`. Roles: `public`. Scope: `global`. MFA: not-required. Step-up: none. Audit: `suggestion.received`. State-machine events: `suggestion.receive`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicSuggestionRequest'
            examples:
              correction:
                summary: correction
                externalValue: examples/createSuggestion.request.correction.json
              new_masjid:
                summary: new masjid
                externalValue: examples/createSuggestion.request.new_masjid.json
      responses:
        '202':
          description: Accepted. Uniform body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              examples:
                default:
                  summary: Example
                  externalValue: examples/createSuggestion.response.202.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      security: []
      servers:
      - url: https://api.{domain}
        description: 'Listener write host: no cookies, public routes only.'
        variables:
          domain:
            default: deen.example
            description: Registrable domain of the deployment.
      x-host: api
      x-roles:
      - public
      x-scope: global
      x-mfa: not-required
      x-step-up: none
      x-audit-action: suggestion.received
      x-rate-limit: public_write
      x-auth: none
      x-csrf: not-applicable
      x-events:
      - suggestion.receive
  /v1/public/abuse-reports:
